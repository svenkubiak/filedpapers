# Application configuration
#
# Values in the active environment overwrite default values.
#
# dev and test use the literal secrets below. prod is the Docker installation:
# every secret is file{} and is read from a file named like the configuration
# key. The directory is /run/secrets, unless APPLICATION_SECRETS_PATH is set.
# install.sh creates those files and does not write a second config.yaml.
#
# application.url reads APPLICATION_URL and falls back to http://localhost.
# application.registration reads APPLICATION_REGISTRATION and falls back to true.
# application.trash.retention reads APPLICATION_TRASH_RETENTION and falls back to 72.
# connector.http.port reads CONNECTOR_HTTP_PORT and falls back to 9090.
# persistence.mongo.host reads PERSISTENCE_MONGO_HOST and has no fallback.
# persistence.mongo.username reads PERSISTENCE_MONGO_USERNAME and falls back to filedpapers.
# persistence.mongo.authdb reads PERSISTENCE_MONGO_AUTHDB and falls back to admin.
# SMTP host, port, username, from, protocol, authentication and debug read SMTP_* and have no fallback.
# smtp.password is secrets/smtp.password.

